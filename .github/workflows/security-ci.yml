name: Security CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/private-session-access-20261003-d7073e5

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-audit:
    name: Node 22 tests, build and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      REALTIME_ACCESS_TOKEN: ""
      PUBLIC_ORIGIN: ""
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the declared Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install the committed dependency lock without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build, run security tests and construct the SDK without external networking
        run: npm run build
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/.github/scripts/loopback-only.mjs
      - name: Check the locked dependencies for known advisories
        run: npm audit --audit-level=low --registry=https://registry.npmjs.org
